n asema.", "en": "This is a station.", "romaji": "koko wa eki desu."}], "note": "です liittyy substantiiveihin ja な-adjektiiveihin; sitä ei lisätä verbin perusmuodon perään.", "en": "I am a student.", "romaji": "watashi wa gakusei desu."}, {"title": "です — kohtelias väitelause", "body": "Substantiivi + です muodostaa kohteliaan lauseen.", "jp": "これは本です。", "read": "これはほんです。", "fi": "Tämä on kirja.", "more": [{"jp": "これは何ですか。", "read": "これはなんですか。", "fi": "Mikä tämä on?", "en": "What is this?", "romaji": "kore wa nan desu ka?"}, {"jp": "それは私の本です。", "read": "それはわたしのほんです。", "fi": "Se on minun kirjani.", "en": "That is my book.", "romaji": "sore wa watashi no hon desu."}], "note": "これ = tämä puhujan lähellä; それ = tuo kuulijan lähellä; あれ = tuo kauempana molemmista.", "en": "This is a book.", "romaji": "kore wa hon desu."}, {"title": "か — kysymys", "body": "Lisää kohteliaan lauseen loppuun か.", "jp": "学生ですか。", "read": "がくせいですか。", "fi": "Oletko opiskelija?", "more": [{"jp": "駅はどこですか。", "read": "えきはどこですか。", "fi": "Missä asema on?", "en": "Where is the station?", "romaji": "eki wa doko desu ka?"}, {"jp": "これはお茶ですか。", "read": "これはおちゃですか。", "fi": "Onko tämä teetä?", "en": "Is this tea?", "romaji": "kore wa ocha desu ka?"}], "note": "Kysymyspartikkeli か lisätään tavallisesti kohteliaan lauseen loppuun. Puheessa kysymys voi syntyä myös intonaatiolla.", "en": "Are you a student?", "romaji": "gakusei desu ka?"}, {"title": "の — omistus ja suhde", "body": "A の B ilmaisee esimerkiksi että B kuuluu A:lle.", "jp": "私の本です。", "read": "わたしのほんです。", "fi": "Se on minun kirjani.", "more": [{"jp": "先生の名前です。", "read": "せんせいのなまえです。", "fi": "Se on opettajan nimi.", "en": "It is the teacher's name.", "romaji": "sensei no namae desu."}, {"jp": "日本語の本です。", "read": "にほんごのほんです。", "fi": "Se on japaninkielinen kirja.", "en": "It is a Japanese-language book.", "romaji": "nihongo no hon desu."}], "note": "の ilmaisee omistusta tai määritettä: 日本語の本 on japaninkielinen kirja, ei välttämättä Japanissa omistettu kirja.", "en": "It is my book.", "romaji": "watashi no hon desu."}, {"title": "も — myös", "body": "も voi korvata は-partikkelin, kun tarkoitetaan myös.", "jp": "私も学生です。", "read": "わたしもがくせいです。", "fi": "Minäkin olen opiskelija.", "more": [{"jp": "私も行きます。", "read": "わたしもいきます。", "fi": "Minäkin menen.", "en": "I will go too.", "romaji": "watashi mo ikimasu."}, {"jp": "水もあります。", "read": "みずもあります。", "fi": "Vettäkin on.", "en": "There is water too.", "romaji": "mizu mo arimasu."}], "note": "も korvaa usein は- tai が-partikkelin, mutta muiden partikkelien kanssa yhdistelmät vaihtelevat.", "en": "I am a student too.", "romaji": "watashi mo gakusei desu."}, {"title": "を — tekemisen kohde", "body": "を (lausutaan o) merkitsee suoraa objektia.", "jp": "本を読みます。", "read": "ほんをよみます。", "fi": "Luen kirjaa.", "more": [{"jp": "寿司を食べます。", "read": "すしをたべます。", "fi": "Syön sushia.", "en": "I eat sushi.", "romaji": "sushi o tabemasu."}, {"jp": "切符を買います。", "read": "きっぷをかいます。", "fi": "Ostan lipun.", "en": "I buy a ticket.", "romaji": "kippu o kaimasu."}], "note": "を kirjoitetaan wo-kana-merkillä, mutta lausutaan tavallisesti o. Se merkitsee usein suoraa objektia.", "en": "I read a book.", "romaji": "hon o yomimasu."}, {"title": "に — aika ja kohde", "body": "に ilmaisee mm. tarkan ajan ja määränpään.", "jp": "七時に起きます。", "read": "しちじにおきます。", "fi": "Herään seitsemältä.", "more": [{"jp": "八時に会います。", "read": "はちじにあいます。", "fi": "Tapaamme kahdeksalta.", "en": "I meet someone at eight.", "romaji": "hachiji ni aimasu."}, {"jp": "駅に行きます。", "read": "えきにいきます。", "fi": "Menen asemalle.", "en": "I go to the station.", "romaji": "eki ni ikimasu."}], "note": "に voi ilmaista ajankohdan, määränpään tai olemassaolon sijainnin. Sitä ei yleensä käytetä esimerkiksi 毎日-sanan kanssa.", "en": "I wake up at seven.", "romaji": "shichiji ni okimasu."}, {"title": "で — tekemisen paikka", "body": "で ilmaisee paikan, jossa toimintaa tapahtuu.", "jp": "学校で勉強します。", "read": "がっこうでべんきょうします。", "fi": "Opiskelen koulussa.", "more": [{"jp": function listPage(type){kind=type;const data=type==='words'?words:kanji;const cats=type==='words'?[...new Set(words.map(x=>x.cat))]:[];el.innerHTML=`<div class="panel"><h2>${type==='words'?'100 N5-alkeissanaa':'50 alkeiskanjia'}</h2><div class="controls"><input id="search" placeholder="Hae suomeksi, japaniksi tai romajilla…"><select id="category"><option value="">Kaikki ryhmät</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button id="mode">Muistikorttitila</button></div><div id="list"></div></div>`;const inp=document.getElementById('search'),sel=document.getElementById('category');function update(){const s=inp.value.toLowerCase(),cat=sel.value;const filt=data.filter(x=>(x.jp+x.read+x.fi+romaji(x.read)).toLowerCase().includes(s)&&(!cat||x.cat===cat));document.getElementById('list').innerHTML=`<p class="muted">${filt.length} tulosta</p><div class="grid">${filt.map(x=>{let key=(type==='words'?'w:':'k:')+x.jp;return `<div class="term"><b>${esc(x.jp)}</b><div class="muted">${esc(x.read)} · <strong>${esc(romaji(x.read))}</strong></div><div>${esc(x.fi)}</div>${type==='kanji'?`<div class="small muted">Esim. ${esc(x.example)} · ${esc(exampleRomaji(x.example))}</div>`:''}<p><button data-key="${esc(key)}">${learned[key]?'✓ Osaan':'Merkitse osatuksi'}</button></p></div>`}).join('')}</div>`;document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{learned[b.dataset.key]=!learned[b.dataset.key];save();update()})}inp.oninput=sel.onchange=update;document.getElementById('mode').onclick=()=>flashPage(type);update()}

function makeQuiz(){const type=document.getElementById('qtype')?.value||'mixed';let pool=type==='mixed'?['words','kanji','grammar']: [type];const chosen=pool[Math.floor(Math.random()*pool.length)];let idx,correct,options,prompt,explain;if(chosen==='grammar'){idx=Math.floor(Math.random()*grammar.length);const g=grammar[idx];prompt=`Mitä lause tarkoittaa? ${g.jp} (${grammarRomaji[idx]})`;correct=g.fi;explain=g.title+' — '+g.body;options=[correct,...grammar.filter((x,i)=>i!==idx).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.fi)]}else{const data=chosen==='words'?words:kanji;idx=Math.floor(Math.random()*data.length);let x=data[idx];prompt=`Mitä tarkoittaa ${x.jp} (${x.read} / ${romaji(x.read)})?`;correct=x.fi;explain=chosen==='words'?`Ryhmä: ${x.cat}`:`Esimerkki: ${x.example} (${exampleRomaji(x.example)})`;options=[correct,...data.filter((a,i)=>i!==idx&&a.fi!==correct).sort(()=>Math.random()-.5).slice(0,3).map(a=>a.fi)]}q={prompt,correct,options:options.sort(()=>Math.random()-.5),explain};answered=false;drawQuestion()}

function hiraganaOf(jp){return [...jp].map(c=>c>='ァ'&&c<='ヶ'?String.fromCharCode(c.charCodeAt(0)-96):c).join('')}
function katakanaOf(jp){return [...jp].map(c=>c>='ぁ'&&c<='ゖ'?String.fromCharCode(c.charCodeAt(0)+96):c).join('')}

// Greedy set-cover ordering ensures all coverable table entries are exercised in one cycle.
function shuffleKana(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeKanaOrder(){let remaining=shuffleKana(kanaWords.map(([jp,r])=>({h:hiraganaOf(jp),k:katakanaOf(jp),r,units:unitsIn(jp)})));let missing=new Set(kanaTargets.map(x=>x[0]));let ordered=[];while(missing.size){let best=-1,score=0;for(let i=0;i<remaining.length;i++){let n=remaining[i].units.filter(x=>missing.has(x)).length;if(n>score){score=n;best=i}}if(best<0)break;let item=remaining.splice(best,1)[0];ordered.push(item);item.units.forEach(x=>missing.delete(x))}return {ordered:ordered.concat(shuffleKana(remaining)),uncovered:[...missing]}}

function renderKanaDrill(){const host=document.getElementById('kana-practice');if(!host)return;if(!kanaOrder.length){resetKanaDrill();return;}const item=kanaOrder[kanaIndex%kanaOrder.length];const script=kanaMode==='mixed'?(kanaIndex%2?'katakana':'hiragana'):kanaMode;const jp=script==='katakana'?item.k:item.h;const total=kanaTargets.length;host.innerHTML=`<h3>Kirjoita sana romajilla</h3><p>Kaikki tehtävät ovat kokonaisia sanoja. Sanat tulevat satunnaisessa järjestyksessä, mutta harjoitus pyrkii kattamaan kaikki taulukon merkit. Uusi kierros sekoitetaan uudelleen.</p><label for="kana-mode">Harjoiteltava kirjoitusjärjestelmä</label> <select id="kana-mode"><option value="mixed" ${kanaMode==='mixed'?'selected':''}>Molemmat vuorotellen</option><option value="hiragana" ${kanaMode==='hiragana'?'selected':''}>Hiragana</option><option value="katakana" ${kanaMode==='katakana'?'selected':''}>Katakana</option></select><p>Oikein ${kanaCorrect}/${kanaTotal} · Tehtävä ${kanaIndex%kanaOrder.length+1}/${kanaOrder.length}</p><p><strong>Merkkikattavuus: ${kanaSeen.size}/${total}</strong> harjoiteltu (vasta tarkistetut sanat lasketaan). ${kanaUncovered.length?'Sanastossa vielä kattamatta: '+kanaUncovered.join('、'):'Kaikki sanoissa käytettävät taulukon merkit löytyvät tehtävistä.'}</p><div style="height:8px;background:#26344b;border-radius:8px;overflow:hidden"><div style="width:${Math.round(kanaSeen.size/total*100)}%;height:100%;background:#4ade80"></div></div><div style="font-size:clamp(38px,8vw,66px);font-weight:700;margin:16px 0">${jp}</div><form id="kana-answer-form"><input id="kana-answer" aria-label="Romaji-vastaus" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="esim. sakura" required style="max-width:320px;width:100%;padding:12px;font-size:19px;border-radius:8px"><button type="submit" style="margin-left:8px">Tarkista</button></form><p id="kana-result" aria-live="polite">${kanaFeedback}</p><button id="kana-next" type="button">Seuraava →</button> <button id="kana-restart" type="button">Aloita alusta</button><p style="font-size:12px;opacity:.75">Huom. を / ヲ on nykyjapanissa lähes aina partikkeli eikä tavallisen itsenäisen sanan osa. Se harjoitellaan kielioppitehtävissä.</p>`;document.getElementById('kana-mode').onchange=e=>{kanaMode=e.target.value;renderKanaDrill()};document.getElementById('kana-answer-form').onsubmit=e=>{e.preventDefault();const val=document.getElementById('kana-answer').value.toLowerCase().trim().replace(/\s+/g,'').replace(/ō/g,'ou').replace(/ū/g,'uu');const expected=item.r;const ok=val===expected;kanaTotal++;if(ok)kanaCorrect++;item.units.forEach(x=>kanaSeen.add(x));kanaFeedback=ok?'✓ Oikein!':'Oikea vastaus: '+expected;document.getElementById('kana-result').textContent=kanaFeedback;document.getElementById('kana-answer').disabled=true;renderKanaDrill();document.getElementById('kana-answer').disabled=true;document.querySelector('#kana-answer-form button').disabled=true;};document.getElementById('kana-next').onclick=()=>{kanaIndex++;if(kanaIndex>=kanaOrder.length){const generated=makeKanaOrder();kanaOrder=generated.ordered;kanaUncovered=generated.uncovered;kanaIndex=0;}kanaFeedback='';renderKanaDrill()};document.getElementById('kana-restart').onclick=resetKanaDrill;}
function kanaPage(){el.innerHTML=`<section class="panel"><h2>Hiragana ja katakana</h2><p>Hiragana vasemmalla, katakana oikealla ja romaji alla. Tyhjät ruudut tarkoittavat, ettei kyseistä tavua ole tavallisessa taulukossa.</p><div id="kana-practice" class="panel" style="margin:22px 0"></div><h3>Perusmerkit (gojūon)</h3>${kanaGrid(kanaRows)}<h3>Soinnilliset ja p-äänteet</h3>${kanaGrid(voicedRows)}<h3>Yhdistelmämerkit (pieni ゃ / ゅ / ょ)</h3><div class="kana-grid">${combos.map(([r,h,k])=>`<div class="kana-cell"><span class="kana-char">${h}</span><span class="kana-char">${k}</span><small>${r}</small></div>`).join('')}</div><h3>Hyvä muistaa</h3><p>っ / ッ kahdentaa seuraavan konsonantin (esim. がっこう — gakkou). ー pidentää vokaalia katakanassa (コーヒー — koohii). Partikkeli は lausutaan wa, へ e ja を o. し = shi, ち = chi, つ = tsu ja ふ = fu.</p></section>`;renderKanaDrill()}
</script></body></html>
